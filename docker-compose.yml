version: '3.8'

# ============================================================
# CẤU HÌNH NHẸ CHO MÁY 8GB RAM
# Chỉ chạy PostgreSQL+pgvector trong Docker.
# Backend chạy thẳng Python trên máy (không cần container).
# pgAdmin bỏ qua để tiết kiệm ~500MB RAM.
# ============================================================

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: legal_pgvector
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-legal_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Giới hạn RAM cho container PostgreSQL (chỉ dùng 512MB)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # Tối ưu PostgreSQL cho RAM thấp bị xóa để tránh lỗi crash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
