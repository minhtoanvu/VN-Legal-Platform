name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: './backend/requirements.txt'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Setup Dummy Environment Variables for Pytest
      run: |
        echo "POSTGRES_USER=postgres" > .env.test
        echo "POSTGRES_PASSWORD=postgres" >> .env.test
        echo "POSTGRES_DB=legal_platform_test" >> .env.test
        echo "POSTGRES_HOST=localhost" >> .env.test
        echo "POSTGRES_PORT=5432" >> .env.test
        echo "SECRET_KEY=dummy_secret_key_for_testing_purposes" >> .env.test
        echo "ALGORITHM=HS256" >> .env.test
        echo "GEMINI_API_KEY=dummy_api_key_for_testing" >> .env.test

    - name: Run pytest
      run: |
        pytest -v
