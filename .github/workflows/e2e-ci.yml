name: E2E Playwright Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'
        
    - name: Install and Run Backend
      working-directory: ./backend
      run: |
        pip install -r requirements.txt
        echo "POSTGRES_USER=postgres" > .env
        echo "POSTGRES_PASSWORD=postgres" >> .env
        echo "POSTGRES_DB=legal_platform_test" >> .env
        echo "POSTGRES_HOST=localhost" >> .env
        echo "POSTGRES_PORT=5432" >> .env
        echo "SECRET_KEY=dummy_secret_key_for_testing_purposes" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "GEMINI_API_KEY=dummy_api_key_for_testing" >> .env
        
        # Chạy migration nếu có
        alembic upgrade head || true
        
        # Start server background
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        
        # Wait for backend to be ready
        timeout 60 bash -c 'until curl -s http://localhost:8000 > /dev/null; do sleep 2; done' || true
        
    - name: Install and Run Frontend
      working-directory: ./frontend
      run: |
        npm ci || npm install
        npm run dev &
        
        # Wait for frontend to be ready
        timeout 60 bash -c 'until curl -s http://localhost:5173 > /dev/null; do sleep 2; done' || true
        
    - name: Install Playwright Browsers & deps
      working-directory: ./tests_e2e
      run: |
        pip install pytest pytest-playwright playwright
        playwright install --with-deps chromium
        
    - name: Run E2E Tests
      working-directory: ./tests_e2e
      run: pytest tests/ -v
      
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: tests_e2e/playwright-report/
        retention-days: 14
